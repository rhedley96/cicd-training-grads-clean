name: Docker Build

# Run manually from the Actions tab ("Run workflow" button)
on:
  pull_request: 
    branches: [main]
  workflow_dispatch:
    

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:  

    - name: checkout code
      uses: actions/checkout@v4

    - name: Set up java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'          

    - name: tests
      run: mvn -B test 
        

    - name: docker build
      run: docker build -t cicd-training-2026 . 
